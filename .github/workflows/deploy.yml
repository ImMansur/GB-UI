name: Deploy GlassBoxOne Web Portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glassboxone-webportal-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: [self-hosted, Linux, X64, glassboxone-webportal]
    env:
      APP_NAME: glassboxone-webportal
      APP_PORT: ${{ vars.GLASSBOXONE_WEBPORTAL_PORT || '3000' }}
      IMAGE_NAME: glassboxone-webportal:latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull --tag "$IMAGE_NAME" ./Frontend

      - name: Replace running container
        run: |
          docker rm --force "$APP_NAME" 2>/dev/null || true
          docker run --detach \
            --name "$APP_NAME" \
            --restart unless-stopped \
            --publish "$APP_PORT:3000" \
            "$IMAGE_NAME"

      - name: Verify deployment
        run: |
          sleep 2
          docker inspect --format '{{.State.Status}}' "$APP_NAME" | grep -Fx running
          wget --spider --quiet "http://127.0.0.1:$APP_PORT/"
